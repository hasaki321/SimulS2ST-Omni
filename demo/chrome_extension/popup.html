<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OmniTalker S2ST</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ee;
        --ink: #1c1a17;
        --accent: #0b6e4f;
        --muted: #5c574f;
        --card: #fffdf8;
        --border: #d9d2c5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px/1.4 "IBM Plex Sans", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        width: 340px;
        padding: 12px;
      }
      h1 {
        font: 600 15px/1.2 "IBM Plex Serif", Georgia, serif;
        margin: 0 0 10px;
      }
      label {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin: 8px 0 3px;
      }
      input, select {
        width: 100%;
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: 6px;
        padding: 7px 8px;
        color: var(--ink);
      }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .btns { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        border: 0;
        border-radius: 6px;
        padding: 8px 10px;
        font-weight: 600;
        cursor: pointer;
      }
      #start { background: var(--accent); color: white; }
      #stop { background: #3d3a35; color: white; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      #status {
        margin-top: 10px;
        padding: 8px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 6px;
        min-height: 36px;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
      }
      #captions {
        margin-top: 8px;
        padding: 8px;
        background: #1c1a17;
        color: #f6f3ee;
        border-radius: 6px;
        min-height: 64px;
        max-height: 160px;
        overflow: auto;
        font-size: 13px;
      }
      .hint { margin-top: 8px; color: var(--muted); font-size: 11px; }
      .check { display:flex; align-items:center; gap:6px; margin-top:8px; color:var(--muted); font-size:12px; }
      .check input { width:auto; }
    </style>
  </head>
  <body>
    <h1>OmniTalker Tab S2ST</h1>
    <label>WebSocket URL</label>
    <input id="wsUrl" type="text" placeholder="ws://127.0.0.1:8765" />
    <div class="row">
      <div>
        <label>Direction</label>
        <select id="direction">
          <option value="en2zh">en → zh</option>
          <option value="zh2en">zh → en</option>
        </select>
      </div>
      <div>
        <label>Latency L</label>
        <select id="latency">
          <option value="1">L1</option>
          <option value="2" selected>L2</option>
          <option value="3">L3</option>
          <option value="4">L4</option>
        </select>
      </div>
    </div>
    <label class="check">
      <input id="hearTab" type="checkbox" /> Also hear original tab (quieter)
    </label>
    <div class="btns">
      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
    </div>
    <button id="beep" style="width:100%;margin-top:8px;background:#8a6d3b;color:#fff;border:0;border-radius:6px;padding:7px;font-weight:600;cursor:pointer">
      Test beep / resume audio
    </button>
    <div id="status">Idle</div>
    <div id="captions">(captions — also shown as a floating bar on the tab)</div>
    <p class="hint">
      Open a normal tab (e.g. Bilibili), press Start. Tab audio is captured and
      streamed to the OmniTalker server; translated audio plays here (~L seconds late).
    </p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
